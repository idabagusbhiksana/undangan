<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Uleman UPACARA RSI YADNYA</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <!-- Gaya CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Audio dengan pendekatan yang kompatibel -->
  <audio id="weddingAudio" loop preload="auto">
    <source src="docs/sugi.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung audio.
  </audio>

</head>

<body>
  <!-- Bingkai undangan -->
  <div class="frame-overlay"></div>

  <div class="container">
    <div class="invitation-content">
      <h1 class="title">Uleman</h1>
      <h2 class="subtitle">Upacara Rsi Yadnya</h2>
      <h2 class="subtitle">Padiksaan</h2>
      <p id="salam" class="greeting"></p>
      
      <div class="couple-names">
        <h1 class="groom">IDA BAGUS KETUT PUTRA</h1>
        <p class="sareng-rabi">sareng rabi</p>
        <h1 class="bride">IDA AYU AGUNG MAS</h1>
      </div>
      
      <div class="divider">⋆⋆⋆⋆⋆</div>
      
      <div class="event-details">
        <p><strong>Tanggal:</strong> 12 Mei 2025</p>
        <p><strong>Tempat:</strong> Griya Gede Pantiyasa, Banjar Bona Kelod,</p>
        <p>Kecamatan Blahbatuh, Kabupaten Gianyar</p>
      </div>

      <h3 class="lokasi-acara">Lokasi Acara</h3>

      <div class="map-container">
        <iframe
          src="https://www.google.com/maps?q=Griya+Gede+Pantiyasa,+Banjar+Bona+Kelod,+Kecamatan+Blahbatuh,+Kabupaten+Gianyar&output=embed"
          width="100%" 
          height="200"
          style="border:0; border-radius: 10px;" 
          allowfullscreen 
          loading="lazy"
          aria-label="Peta lokasi acara">
        </iframe>
      </div>

      <button class="whatsapp-btn" onclick="konfirmasi()">Konfirmasi via WhatsApp</button>
    </div>
  </div>

  <!-- Tombol kontrol musik untuk mobile -->
  <button id="musicToggle" class="music-control" aria-label="Putar musik">
    <span class="music-icon">🎵</span>
  </button>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
